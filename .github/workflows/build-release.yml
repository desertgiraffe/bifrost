name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.2.1-baseline or v2.2.1-glm53fix)'
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: transports/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ inputs.tag }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}

      - name: Extract static binary from image
        run: |
          cid=$(docker create --platform linux/amd64 "${REGISTRY}/${IMAGE_NAME}:${{ inputs.tag }}")
          docker cp "$cid":/app/main ./bifrost-http-linux-amd64
          docker rm "$cid"
          chmod +x ./bifrost-http-linux-amd64
          ./bifrost-http-linux-amd64 --version 2>/dev/null || true

      - name: Create release with binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" ./bifrost-http-linux-amd64 \
            --title "${{ inputs.tag }}" \
            --target "${{ github.sha }}" \
            --notes "Automated build of \`${{ github.ref_name }}\` (commit ${{ github.sha }}).

          - Docker image: \`ghcr.io/${{ github.repository }}:${{ inputs.tag }}\` (linux/amd64, linux/arm64)
          - Binary: statically linked bifrost-http (linux/amd64, sqlite_static)
          - Source branch: ${{ github.ref_name }}"
