name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.2.1-baseline or v2.2.1-glm53fix)'
        required: true

# Least-privilege default: read-only at the top level; jobs that push to GHCR
# or create releases grant write themselves.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Validate inputs
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Validate tag and derive version string
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          # Only [A-Za-z0-9._-] (plus optional leading v) — defense in depth
          # before any shell/registry use.
          if ! printf '%s' "$TAG" | grep -qE '^v?[A-Za-z0-9._-]+$'; then
            echo "Refusing to use unsafe tag value: $TAG" >&2
            exit 1
          fi
          # TAG is used verbatim for image tag and release tag (keeps the v).
          # VERSION strips the v for the Dockerfile build-arg, which stamps it
          # as -X main.Version=v${VERSION}.
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Native runners per arch — no QEMU emulation (emulated CGO/Go builds
        # are 5-20x slower than native).
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: transports/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,scope=build-${{ matrix.arch }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Merge manifest and publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create multi-arch manifest
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          refs=()
          while IFS= read -r digest_file; do
            refs+=("${image}@sha256:$(basename "$digest_file")")
          done < <(find /tmp/digests -type f | sort)
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "No image digests found" >&2
            exit 1
          fi
          docker buildx imagetools create -t "${image}:${TAG}" "${refs[@]}"
          docker buildx imagetools inspect "${image}:${TAG}"

      - name: Extract static binary from image
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:${TAG}"
          cid=$(docker create --platform linux/amd64 "$image")
          docker cp "$cid":/app/main ./bifrost-http-linux-amd64
          docker rm "$cid"
          chmod +x ./bifrost-http-linux-amd64

      - name: Create or update release with binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./bifrost-http-linux-amd64 --clobber
          else
            gh release create "$TAG" ./bifrost-http-linux-amd64 \
              --title "$TAG" \
              --target "${{ github.sha }}" \
              --notes "Automated build of \`${{ github.ref_name }}\` (commit ${{ github.sha }}).

          - Docker image: \`ghcr.io/${{ github.repository }}:${TAG}\` (linux/amd64, linux/arm64)
          - Binary: statically linked bifrost-http (linux/amd64, sqlite_static)
          - Source branch: ${{ github.ref_name }}"
          fi
